name: Dong goi App iPhone (.ipa) PS5Translator 1.28

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_unsigned_ipa:
    runs-on: macos-latest
    steps:
      - name: 1. Tai code du an va icon.png ve may chu Mac
        uses: actions/checkout@v4

      - name: 1b. Chon Xcode moi nhat (Xcode 26 co Apple Intelligence / FoundationModels)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if [ -d "$SDK/System/Library/Frameworks/FoundationModels.framework" ]; then
            echo "HAS_FOUNDATION_MODELS=1" >> $GITHUB_ENV
            echo "SDK co FoundationModels -> bat Apple Intelligence"
          else
            echo "SDK chua co FoundationModels -> app dung Google Dich"
          fi

      - name: 2. Tai chiaki-ng (ban co dinh) + submodule + mbedTLS 2.28
        run: |
          # Co dinh commit chiaki-ng da kiem tra bien dich (khop file takion.pb.c/h trong ChiakiNative/generated)
          CHIAKI_COMMIT=43728af2e639fecb8a7af1cd68c29820a40de973
          mkdir chiaki_upstream && cd chiaki_upstream
          git init -q
          git remote add origin https://github.com/streetpea/chiaki-ng.git
          git fetch -q --depth 1 origin "$CHIAKI_COMMIT"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete
          cd ..
          git clone -q --depth 1 --branch v2.28.8 https://github.com/Mbed-TLS/mbedtls.git mbedtls_upstream

      - name: 3. Bien dich loi Remote Play chiaki-ng day du cho iPhone (libps5native.a)
        run: |
          chmod +x scripts/build_chiaki_native.sh
          ./scripts/build_chiaki_native.sh chiaki_upstream mbedtls_upstream build_native

          mkdir -p Sources/ChiakiNative
          cp ChiakiNative/ChiakiCBridge.h Sources/ChiakiNative/ChiakiCBridge.h
          cp ChiakiNative/PS5RemotePlayBridge.h Sources/ChiakiNative/PS5RemotePlayBridge.h
          cat << 'EOF' > Sources/PS5Translator-Bridging-Header.h
          #include "ChiakiNative/ChiakiCBridge.h"
          #include "ChiakiNative/PS5RemotePlayBridge.h"
          EOF

      - name: 4. Gom cac file Swift va icon
        run: |
          for f in *.swift.txt; do
            [ -f "$f" ] && cp "$f" "Sources/${f%.txt}"
          done

          for f in *.swift; do
            [ -f "$f" ] && cp "$f" "Sources/$f"
          done

          python3 - << 'PYEOF'
          import glob, os, re

          files = sorted(glob.glob("Sources/*.swift"))
          seen_main = False
          for p in files:
              with open(p, "r", encoding="utf-8") as f:
                  txt = f.read()
              if "@main" in txt:
                  if seen_main:
                      print(f"Removing duplicate @main file: {p}")
                      os.remove(p)
                      continue
                  seen_main = True

          for path in glob.glob("Sources/*.swift"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              modified = False

              if "stopCapture(completionHandler: nil)" in content:
                  content = content.replace("stopCapture(completionHandler: nil)", "stopCapture { _ in }")
                  modified = True

              if "static let rpClientType =" in content:
                  content = re.sub(
                      r'static let rpClientType\s*=\s*"[^"]+"',
                      'static let rpClientType = "dabfa2ec873de5839bee8d3f4c0239c4282c07c25c6077a2931afcf0adc0d34f"',
                      content
                  )
                  modified = True

              if modified:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Successfully hooked C-Bridge into {path}")
          PYEOF

          # 1.18: ma nguon app TV Samsung di kem app iPhone (cai TV truc tiep tu iPhone)
          if [ -d "TVApp" ]; then
            cp TVApp/* Sources/
            # 1.25: doi duoi icon TV sang .bin de Xcode KHONG chuyen PNG sang dinh dang CgBI cua Apple
            # (TV Samsung khong doc duoc CgBI -> app TV mat icon)
            if [ -f Sources/tv_app_icon.png ]; then
              mv Sources/tv_app_icon.png Sources/tv_app_icon.bin
            fi
          fi

          if [ -f "icon.png" ]; then
            cp icon.png Sources/icon.png
            mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
            sips -z 1024 1024 icon.png --out Sources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
            cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "Icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          fi

          # 1.19: logo MQ tren thanh dau app
          if [ -f "app_logo.png" ]; then
            cp app_logo.png Sources/app_logo.png
          fi

          if [ -f "game_data.sqlite" ]; then
            cp game_data.sqlite Sources/
          fi

          cat << 'EOF' > project.yml
          name: PS5Translator
          options:
            bundleIdPrefix: com.ps5viet
          targets:
            PS5Translator:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: PS5 Translator
                  UILaunchScreen: {}
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSLocalNetworkUsageDescription: "Cho phep ket noi Wi-Fi noi bo voi PS5 va TV Samsung de truyen phu de."
                  NSAppTransportSecurity:
                    NSAllowsLocalNetworking: true
                  UIBackgroundModes:
                    - audio
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ps5viet.translator
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  COMPRESS_PNG_FILES: NO
                  STRIP_PNG_TEXT: NO
                  SWIFT_OBJC_BRIDGING_HEADER: Sources/PS5Translator-Bridging-Header.h
                  HEADER_SEARCH_PATHS:
                    - "$(inherited)"
                    - "$(PROJECT_DIR)/Sources/ChiakiNative"
                  LIBRARY_SEARCH_PATHS:
                    - "$(inherited)"
                    - "$(PROJECT_DIR)/build_native"
                  OTHER_LDFLAGS:
                    - "$(inherited)"
                    - "-lps5native"
                  OTHER_CFLAGS:
                    - "$(inherited)"
                    - "-Wno-implicit-function-declaration"
                    - "-Wno-strict-prototypes"
                    - "-Wno-documentation"
                    - "-Wno-unused-function"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
                  AD_HOC_CODE_SIGNING_ALLOWED: YES
          EOF

      - name: 5. Khoi tao Project Xcode bang XcodeGen
        run: |
          if [ "${HAS_FOUNDATION_MODELS}" = "1" ]; then
            # Lien ket "yeu" de app van chay tren iPhone iOS < 26
            python3 - << 'PYEOF'
          p = "project.yml"
          s = open(p).read()
          import re
          m = re.search(r'^([ ]*)- "-lps5native"$', s, re.M)
          ind = m.group(1)
          s = s.replace(m.group(0), m.group(0) + "\n" + ind + '- "-weak_framework"\n' + ind + '- "FoundationModels"', 1)
          open(p, "w").write(s)
          PYEOF
          fi
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: 6. Bien dich Swift + Loi C Chiaki-NG thanh App iPhone
        run: |
          xcodebuild clean build \
            -project PS5Translator.xcodeproj \
            -target PS5Translator \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build_output" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 7. Dong goi thanh file PS5Translator.ipa
        run: |
          mkdir -p Payload
          cp -r build_output/Release-iphoneos/PS5Translator.app Payload/
          zip -r PS5Translator.ipa Payload

      - name: 8. Xuat file PS5Translator.ipa de tai ve Windows
        uses: actions/upload-artifact@v4
        with:
          name: File_Cai_Dat_PS5Translator_IPA
          path: PS5Translator.ipa
